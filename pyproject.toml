[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-avatar-prototype"
version = "0.1.0"
description = "Temporary keyless local conversational avatar prototype for Kaggle"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "websockets>=12,<16"
]

local-models = [
  "huggingface-hub>=0.24,<1",
  "onnxruntime>=1.18,<2",
  "sherpa-onnx>=0.4,<1",
  "silero-vad>=5,<6",
  "kokoro>=0.9,<1"
]

[project.scripts]
avatar-prototype = "avatar_prototype.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
